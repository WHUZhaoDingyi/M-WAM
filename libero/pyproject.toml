[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mwam-train"
version = "0.1.0"
description = "M-WAM joint action and 3D scene motion training on LIBERO"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "h5py>=3.10", "torch==2.9.1", "PyYAML>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mwam*"]
