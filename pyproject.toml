[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mwam"
version = "0.2.0"
description = "M-WAM all-view 3D motion, AC attention and trajectory action tokens"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.6",
    "numpy>=1.26",
    "h5py>=3.10",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "accelerate>=1.12",
    "einops>=0.8",
    "safetensors>=0.5",
    "transformers>=4.49",
    "ftfy>=6",
    "sentencepiece>=0.2",
    "regex>=2024.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]
distributed = ["deepspeed>=0.18"]
perception = ["pillow>=10", "torchvision>=0.21", "opencv-python>=4.8"]

[project.scripts]
mwam = "mwam.train_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mwam*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
