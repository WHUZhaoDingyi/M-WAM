[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mwam"
version = "0.2.0"
description = "M-WAM all-view 3D motion, AC attention and trajectory action tokens"
requires-python = ">=3.10"
dependencies = ["torch>=2.6", "numpy>=1.26", "hydra-core>=1.3", "omegaconf>=2.3", "einops>=0.8", "rich>=13", "safetensors>=0.5", "huggingface-hub>=0.29", "modelscope>=1.20", "imageio>=2.30", "pillow>=10", "accelerate>=1.12", "h5py>=3.10", "transformers>=4.49", "ftfy>=6", "sentencepiece>=0.2", "tqdm>=4.66", "regex>=2024.0"]

[project.optional-dependencies]
test = ["pytest>=7"]
distributed = ["deepspeed>=0.18"]
perception = ["torchvision>=0.21", "opencv-python>=4.8"]

[project.scripts]
mwam = "mwam.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mwam*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
